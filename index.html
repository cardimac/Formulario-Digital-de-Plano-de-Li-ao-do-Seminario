<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano de Lição — Seminário | Planejamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#efe9dc;
    --surface:#fffdf8;
    --surface-alt:#f7f2e6;
    --ink:#2a2620;
    --ink-soft:#6b6455;
    --accent:#2f4a3d;
    --accent-soft:#d7e0d5;
    --gold:#a9812e;
    --gold-soft:#f1e6c8;
    --line:#d8cfba;
    --danger:#9c4b3b;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    padding:32px 16px 120px;
  }
  .wrap{max-width:840px;margin:0 auto;}

  /* ---------- Header / Cover ---------- */
  .cover{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:32px 36px;
    margin-bottom:28px;
  }
  .cover-eyebrow{
    color:var(--gold);
    font-size:13px;
    font-weight:600;
    letter-spacing:.02em;
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:34px;
    margin:0 0 4px;
    color:var(--accent);
  }
  .cover-sub{
    color:var(--ink-soft);
    font-size:15px;
    margin-bottom:28px;
  }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px 20px;
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.span2{grid-column:1 / -1;}
  label{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
  }
  input[type=text],input[type=date],input[type=number],textarea,select{
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
    background:var(--surface-alt);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    outline:none;
    width:100%;
  }
  input:focus,textarea:focus,select:focus,[contenteditable]:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  textarea{resize:vertical;min-height:64px;font-family:'Inter',sans-serif;}

  /* ---------- Etapas ---------- */
  .etapa{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:20px;
    overflow:hidden;
  }
  .etapa-head{
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:22px 26px 16px;
    border-bottom:1px solid var(--line);
  }
  .badge{
    flex:none;
    width:36px;height:36px;
    border-radius:50%;
    background:var(--gold-soft);
    color:var(--gold);
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    display:flex;align-items:center;justify-content:center;
  }
  .etapa-titles{flex:1;}
  .etapa-titles h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    margin:2px 0 4px;
    color:var(--accent);
  }
  .etapa-titles p{
    margin:0;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .time-chip{
    flex:none;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--surface-alt);
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 12px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .time-chip input{
    width:44px;
    border:none;
    background:transparent;
    padding:0;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    text-align:right;
  }
  .time-chip input:focus{box-shadow:none;}

  .toolbar{
    display:flex;
    gap:4px;
    padding:10px 26px;
    background:var(--surface-alt);
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .toolbar button{
    width:32px;height:32px;
    border:1px solid transparent;
    background:transparent;
    border-radius:6px;
    color:var(--ink-soft);
    font-size:14px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .toolbar button:hover{background:var(--surface);border-color:var(--line);color:var(--ink);}
  .toolbar button.b{font-weight:800;}
  .toolbar button.i{font-style:italic;}
  .toolbar button.u{text-decoration:underline;}
  .toolbar .sep{width:1px;background:var(--line);margin:4px 4px;}

  .editable{
    min-height:110px;
    padding:18px 26px 24px;
    font-size:15px;
    outline:none;
  }
  .editable:empty:before{
    content:attr(data-placeholder);
    color:#a39d8c;
  }
  .editable ul{margin:0;padding-left:22px;}
  .editable ol{margin:0;padding-left:22px;}



  /* ---------- Total time bar ---------- */
  .totalbar{
    background:var(--accent);
    color:#fff;
    border-radius:var(--radius);
    padding:18px 26px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:28px;
  }
  .totalbar .label{font-size:13px;letter-spacing:.02em;opacity:.85;}
  .totalbar .value{font-family:'Fraunces',serif;font-size:26px;font-weight:600;}

  /* ---------- Actions ---------- */
  .actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  .actions button{
     flex:1;
     min-width:150px;
     padding:14px 18px;
     border-radius:10px;
     border:1px solid transparent;
     color:#fff;
     font-family:'Inter',sans-serif;
     font-weight:600;
     font-size:14.5px;
     cursor:pointer;
     transition:opacity .15s ease, transform .15s ease;
   }
   .actions button:hover{
     opacity:.9;
     transform:translateY(-1px);
   }
   #btn-ver{
     background:#2563eb;
     border-color:#2563eb;
   }
   #btn-baixar{
     background:#ea580c;
     border-color:#ea580c;
   }
   #btn-compartilhar{
     background:#16a34a;
     border-color:#16a34a;
   }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(20,18,14,.6);
    display:none;
    align-items:center;justify-content:center;
    padding:24px;
    z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:#fff;
    border-radius:14px;
    max-width:600px;
    width:100%;
    max-height:88vh;
    overflow:auto;
    padding:24px;
  }
  .modal h3{
    font-family:'Fraunces',serif;
    color:var(--accent);
    margin:0 0 14px;
  }
  .modal img{width:100%;border-radius:8px;border:1px solid var(--line);display:block;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .modal-actions button{
    flex:1;min-width:130px;
    padding:12px 14px;border-radius:8px;
    border:1px solid var(--accent);
    background:var(--accent);color:#fff;
    font-weight:600;font-size:14px;cursor:pointer;
  }
  .modal-actions button.secondary{background:transparent;color:var(--accent);}
  .modal-close{
    background:none;border:none;color:var(--ink-soft);
    font-size:13px;cursor:pointer;margin-top:12px;
  }
  .status{
    text-align:center;font-size:13px;color:var(--ink-soft);
    margin-top:10px;min-height:16px;
  }

  /* Hide chrome while capturing */
  body.capturing .toolbar,
  body.capturing .actions,
  body.capturing .time-chip .hint{display:none !important;}
  body.capturing input,
  body.capturing textarea{background:transparent;border-color:#cfc6ad;}
  body.capturing .editable:empty:before{content:"";}

  @media(max-width:640px){
    .grid2{grid-template-columns:1fr;}
    .etapa-head{flex-wrap:wrap;}
    .time-chip{margin-left:50px;}
  }
</style>
</head>
<body>
<div class="wrap" id="capture-area">

  <div class="cover">
    <h1>Plano de Lição</h1>
    <div class="cover-sub">Planejamento de Lição do Seminário</div>

    <div class="grid2">
      <div class="field">
        <label for="f-data">Data</label>
        <input type="date" id="f-data">
      </div>
      <div class="field">
        <label for="f-estaca">Estaca</label>
        <input type="text" id="f-estaca" placeholder="Nome da estaca">
      </div>
      <div class="field">
        <label for="f-ala">Ala</label>
        <input type="text" id="f-ala" placeholder="Nome da ala">
      </div>
      <div class="field">
        <label for="f-professor">Nome do Professor</label>
        <input type="text" id="f-professor" placeholder="Professor(a) responsável">
      </div>
      <div class="field">
        <label for="f-tema">Tema</label>
        <input type="text" id="f-tema" placeholder="Tema da lição">
      </div>
      <div class="field">
        <label for="f-tipo">Tipo de Lição</label>
        <select id="f-tipo">
          <option value="" disabled selected>Selecione o tipo</option>
          <option value="Lições das Escrituras">Lições das Escrituras</option>
          <option value="Lições de prática de domínio doutrinário">Lições de prática de domínio doutrinário</option>
          <option value="Lições de avaliação de aprendizado">Lições de avaliação de aprendizado</option>
          <option value="Lições de preparação para a vida">Lições de preparação para a vida</option>
        </select>
      </div>
      <div class="field">
        <label for="f-numero">Número da Lição</label>
        <input type="text" id="f-numero" placeholder="Ex.: Lição 24">
      </div>
      <div class="field">
        <label for="f-escritura">Escritura</label>
        <input type="text" id="f-escritura" placeholder="Ex.: Alma 32:21">
      </div>
      <div class="field span2">
        <label for="f-proposito">Propósito da Lição</label>
        <textarea id="f-proposito" placeholder="Qual é o objetivo desta aula?"></textarea>
      </div>
      <div class="field span2">
        <label for="f-preparacao">Preparação do Aluno</label>
        <textarea id="f-preparacao" placeholder="O que os alunos devem preparar antes da aula?"></textarea>
      </div>
    </div>
  </div>

  <!-- Etapas do plano -->
  <div id="etapas"></div>

  <div class="totalbar">
    <div>
      <div class="label">TEMPO TOTAL PLANEJADO</div>
    </div>
    <div class="value" id="total-time">0 min</div>
  </div>

</div>

<div class="actions">
  <button type="button" class="secondary" id="btn-ver">Ver Imagem</button>
  <button type="button" id="btn-baixar">Baixar Imagem</button>
  <button type="button" id="btn-compartilhar">Compartilhar</button>
</div>
<div class="status" id="status"></div>

<!-- Modal -->

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3>Pré-visualização do Plano de Aula</h3>
    <img id="modal-img" src="" alt="Plano de aula gerado">
    <div class="modal-actions">
      <button type="button" id="modal-baixar">Baixar Imagem</button>
      <button type="button" class="secondary" id="modal-compartilhar">Compartilhar</button>
    </div>
    <button type="button" class="modal-close" id="modal-close">Fechar</button>
  </div>
</div>

<script>
const ETAPAS = [
  {
    n: 1,
    titulo: "Preparar",
    desc: "Criar as condições para a compreensão."
  },
  {
    n: 2,
    titulo: "Encontrar",
    desc: "Significar as verdades do evangelho e conectá-las a Cristo."
  },
  {
    n: 3,
    titulo: "Solidificar",
    desc: "Fortalecer a compreensão através do domínio doutrinário."
  },
  {
    n: 4,
    titulo: "Convidar",
    desc: "Convidar os alunos a viver o que aprenderam."
  },
  {
    n: 5,
    titulo: "Aplicar",
    desc: "Identificar formas práticas de viver o evangelho."
  },
  {
    n: 6,
    titulo: "Relembrar",
    desc: "Reconhecer as verdades aprendidas."
  }
];

const etapasContainer = document.getElementById('etapas');

ETAPAS.forEach(etapa => {
  const el = document.createElement('div');
  el.className = 'etapa';
  el.innerHTML = `
    <div class="etapa-head">
      <div class="badge">${etapa.n}</div>
      <div class="etapa-titles">
        <h2>Etapa ${etapa.n}: ${etapa.titulo}</h2>
        <p>${etapa.desc}</p>
      </div>
      <div class="time-chip">
        <span class="hint">⏱</span>
        <input type="number" min="0" step="1" class="time-input" placeholder="0" data-etapa="${etapa.n}">
        <span>min</span>
      </div>
    </div>
    <div class="toolbar" data-target="edit-${etapa.n}">
      <button type="button" class="b" data-cmd="bold" title="Negrito">B</button>
      <button type="button" class="i" data-cmd="italic" title="Itálico">I</button>
      <button type="button" class="u" data-cmd="underline" title="Sublinhado">U</button>
      <div class="sep"></div>
      <button type="button" data-cmd="insertUnorderedList" title="Lista com marcadores">&#8226;&#8226;&#8226;</button>
      <button type="button" data-cmd="insertOrderedList" title="Lista numerada">1.2.3</button>
      <div class="sep"></div>
      <button type="button" data-cmd="removeFormat" title="Limpar formatação">&#10005;</button>
    </div>
    <div class="editable" id="edit-${etapa.n}" contenteditable="true"
         data-placeholder="Descreva o plano para esta etapa..."></div>
  `;
  etapasContainer.appendChild(el);
});

// Toolbar actions
document.querySelectorAll('.toolbar').forEach(bar => {
  bar.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetId = bar.getAttribute('data-target');
      document.getElementById(targetId).focus();
      document.execCommand(btn.getAttribute('data-cmd'), false, null);
    });
  });
});

// Total time calculation
function updateTotal(){
  let total = 0;
  document.querySelectorAll('.time-input').forEach(inp => {
    const v = parseInt(inp.value, 10);
    if(!isNaN(v)) total += v;
  });
  const h = Math.floor(total / 60);
  const m = total % 60;
  const label = h > 0 ? `${h}h ${m}min` : `${m} min`;
  document.getElementById('total-time').textContent = label;
}
document.addEventListener('input', (e) => {
  if(e.target.classList.contains('time-input')) updateTotal();
});
updateTotal();

// ---------- Image generation ----------
const statusEl = document.getElementById('status');
const overlay = document.getElementById('modal-overlay');
const modalImg = document.getElementById('modal-img');
let lastDataUrl = null;

function setStatus(msg){
  statusEl.textContent = msg;
  if(msg) setTimeout(() => { if(statusEl.textContent === msg) statusEl.textContent = ''; }, 4000);
}

async function generateImage(){
  setStatus('Gerando imagem, aguarde...');
  document.body.classList.add('capturing');
  const target = document.getElementById('capture-area');
  try{
    const canvas = await html2canvas(target, {
      scale: 2,
      backgroundColor: '#efe9dc',
      useCORS: true
    });
    lastDataUrl = canvas.toDataURL('image/png');
    return lastDataUrl;
  } finally {
    document.body.classList.remove('capturing');
  }
}

function fileNameForToday(){
  const tema = document.getElementById('f-tema').value.trim();
  const base = tema ? tema.replace(/[^a-zA-Z0-9À-ÿ ]/g,'').replace(/\s+/g,'-') : 'plano-de-aula';
  return `${base}.png`;
}

async function downloadImage(){
  const url = await generateImage();
  const a = document.createElement('a');
  a.href = url;
  a.download = fileNameForToday();
  document.body.appendChild(a);
  a.click();
  a.remove();
  setStatus('Imagem baixada com sucesso.');
}

async function shareImage(){
  const url = await generateImage();
  try{
    const res = await fetch(url);
    const blob = await res.blob();
    const file = new File([blob], fileNameForToday(), { type: 'image/png' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({
        files: [file],
        title: 'Plano de Aula do Seminário',
        text: 'Segue o plano de aula.'
      });
      setStatus('Compartilhado com sucesso.');
      return;
    }
  } catch(err){
    // fall through to fallback below
  }
  // Fallback: baixa a imagem e abre o WhatsApp Web para anexar manualmente
  const a = document.createElement('a');
  a.href = url;
  a.download = fileNameForToday();
  document.body.appendChild(a);
  a.click();
  a.remove();
  setStatus('Seu navegador não permite anexar a imagem automaticamente. A imagem foi baixada — anexe-a manualmente no WhatsApp ou outro app.');
  window.open('https://wa.me/?text=Segue%20o%20plano%20de%20aula%20do%20semin%C3%A1rio%20(imagem%20em%20anexo).', '_blank');
}

document.getElementById('btn-ver').addEventListener('click', async () => {
  const url = await generateImage();
  modalImg.src = url;
  overlay.classList.add('open');
});
document.getElementById('btn-baixar').addEventListener('click', downloadImage);
document.getElementById('btn-compartilhar').addEventListener('click', shareImage);

document.getElementById('modal-baixar').addEventListener('click', downloadImage);
document.getElementById('modal-compartilhar').addEventListener('click', shareImage);
document.getElementById('modal-close').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('open'); });
</script>
</body>
</html>
